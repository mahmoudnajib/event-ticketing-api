name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_ticketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: |
          cat << 'EOF' > .env.test
          PORT=3000
          NODE_ENV=test
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=event_ticketing_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_DB=1
          JWT_ACCESS_SECRET=ci_test_access_secret_change_me
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_ACCESS_TTL=900
          JWT_REFRESH_SECRET=ci_test_refresh_secret_change_me
          JWT_REFRESH_EXPIRES_IN=7d
          JWT_REFRESH_TTL=604800
          GOOGLE_CLIENT_ID=ci_google_client_id
          GOOGLE_CLIENT_SECRET=ci_google_client_secret
          GOOGLE_CALLBACK_URL=http://localhost:3000/api/auth/google/callback
          STRIPE_SECRET_KEY=sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_ci_placeholder
          EOF

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --detectOpenHandles

      - name: Run integration tests
        run: npm run test:int -- --detectOpenHandles

      - name: Run E2E tests
        run: npm run test:e2e -- --detectOpenHandles
